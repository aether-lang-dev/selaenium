[pytest]
# Scoped to the no-browser FFI test. The live-Chrome end-to-end test
# (test/test_live_chrome.py) is a standalone script, not collected here — it
# needs a real chromedriver and is gated on the upstream std.http.client
# Connection:close framing fix. Run it directly once that lands:
#   SELENIUM_CORE_LIB=... python3 test/test_live_chrome.py
testpaths = test
python_files = test_ffi.py
addopts = -ra
