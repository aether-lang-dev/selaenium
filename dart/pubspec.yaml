name: selenium
description: >-
  Selenium WebDriver for Dart — a thin dart:ffi binding over the shared
  pure-Aether WebDriver core (libselenium_core.so). No protocol logic in Dart.
version: 0.1.0

environment:
  sdk: ">=3.1.0 <4.0.0"

# `dart run selenium:fetch_engine` — one explicit, opt-in command that downloads
# + caches the prebuilt pure-Aether engine (libselenium_core) for this platform
# from GitHub releases, so a Dart dev never needs the Aether toolchain.
executables:
  fetch_engine:

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.24.0
