[package]
name = "selenium"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Selenium WebDriver for Rust — a thin FFI wrapper over the shared pure-Aether WebDriver core (libselenium_core.so)."
# `links` lets build.rs publish DEP_SELENIUM_CORE_* metadata to downstream
# crates, so a consumer's build.rs can pick up the native lib dir for its rpath.
links = "selenium_core"

# Zero external crates: the FFI is std::ffi + a hand-rolled minimal JSON module,
# so this builds fully offline with no registry access. The engine .so is linked
# at BUILD time via build.rs (cargo:rustc-link-*), a distinct FFI mechanism from
# the runtime-dlopen bindings (ctypes/Fiddle/koffi) and from cgo.
[dependencies]

[lib]
name = "selenium"
path = "src/lib.rs"
